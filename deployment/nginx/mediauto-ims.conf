server {
    listen 9920 ssl;
    server_name studio.mediauto.dev;

    ssl_certificate /etc/letsencrypt/live/studio.mediauto.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.mediauto.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:9921;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
